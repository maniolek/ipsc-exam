<title>Tor Przepisów IPSC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F0E4;
    --bg-elev:#FDFAF3;
    --card-border:#E4D9C1;
    --ink:#241F17;
    --ink-soft:#6B6151;
    --ink-faint:#948A76;
    --accent:#A9702E;
    --accent-strong:#7C4F1C;
    --accent-ink:#FBF4E6;
    --tan:#D9BE8C;
    --good:#3E6B44;
    --good-bg:#E4EEDE;
    --bad:#A23A2C;
    --bad-bg:#F5DFD8;
    --line: rgba(36,31,23,0.14);
    --shadow: 0 1px 2px rgba(36,31,23,0.06), 0 8px 24px -12px rgba(36,31,23,0.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161209;
      --bg-elev:#1F1A10;
      --card-border:#372C19;
      --ink:#F2E9D8;
      --ink-soft:#C2B49A;
      --ink-faint:#8A7C63;
      --accent:#DDA653;
      --accent-strong:#F0C374;
      --accent-ink:#241A08;
      --tan:#8A6B3E;
      --good:#7FB584;
      --good-bg:#233022;
      --bad:#E2806C;
      --bad-bg:#3A2119;
      --line: rgba(242,233,216,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161209;
    --bg-elev:#1F1A10;
    --card-border:#372C19;
    --ink:#F2E9D8;
    --ink-soft:#C2B49A;
    --ink-faint:#8A7C63;
    --accent:#DDA653;
    --accent-strong:#F0C374;
    --accent-ink:#241A08;
    --tan:#8A6B3E;
    --good:#7FB584;
    --good-bg:#233022;
    --bad:#E2806C;
    --bad-bg:#3A2119;
    --line: rgba(242,233,216,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:2.25rem 1.25rem 5rem;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1rem;
    margin-bottom:1.75rem;
    border-bottom:2px solid var(--card-border);
    padding-bottom:1rem;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:.15rem;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .brand h1{
    font-family:'Big Shoulders Display', ui-sans-serif, sans-serif;
    font-weight:800;
    font-size:1.9rem;
    line-height:1;
    margin:0;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  .stagecount{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    text-align:right;
    color:var(--ink-soft);
    font-size:.85rem;
    white-space:nowrap;
  }
  .stagecount b{
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    font-size:1.1rem;
  }

  .progress{
    display:flex;
    gap:4px;
    margin-bottom:2rem;
  }
  .progress i{
    flex:1;
    height:6px;
    border-radius:3px;
    background:var(--card-border);
    display:block;
  }
  .progress i.done{ background:var(--accent); }
  .progress i.cur{ background:var(--ink-faint); }

  .card{
    background:var(--bg-elev);
    border:1px solid var(--card-border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:1.75rem;
  }

  .cite{
    display:inline-block;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.72rem;
    letter-spacing:.03em;
    color:var(--accent-strong);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding:.2rem .55rem;
    border-radius:999px;
    margin-bottom:.9rem;
  }

  .question{
    font-size:1.22rem;
    line-height:1.4;
    font-weight:600;
    margin:0 0 1.35rem;
    text-wrap:balance;
    max-width:60ch;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:.6rem;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:.7rem;
    text-align:left;
    width:100%;
    padding:.85rem .95rem;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    font-size:.98rem;
    line-height:1.35;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
  }
  .opt:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .opt:active:not(:disabled){ transform: scale(0.996); }
  .opt:disabled{ cursor:default; }
  .opt .tag{
    flex:none;
    width:1.6rem;
    height:1.6rem;
    border-radius:6px;
    background:var(--card-border);
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.75rem;
    font-weight:600;
  }
  .opt.correct{
    background:var(--good-bg);
    border-color:var(--good);
  }
  .opt.correct .tag{ background:var(--good); color:var(--accent-ink); }
  .opt.wrong{
    background:var(--bad-bg);
    border-color:var(--bad);
  }
  .opt.wrong .tag{ background:var(--bad); color:var(--accent-ink); }
  .opt.dim{ opacity:.55; }

  .feedback{
    margin-top:1.1rem;
    padding:.9rem 1rem;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg);
    font-size:.92rem;
    color:var(--ink-soft);
    line-height:1.5;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback b{ color:var(--ink); }
  .feedback .verdict{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.02em;
    display:block;
    margin-bottom:.25rem;
  }
  .feedback.ok .verdict{ color:var(--good); }
  .feedback.no .verdict{ color:var(--bad); }

  .refquote{
    margin:.7rem 0 0;
    padding:.7rem .85rem;
    border-left:3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-radius:0 8px 8px 0;
    font-size:.88rem;
    line-height:1.55;
    color:var(--ink);
  }
  .refquote .reflabel{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-strong);
    margin-bottom:.3rem;
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top:1.4rem;
  }
  button.next{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:1.05rem;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:.7rem 1.4rem;
    border-radius:9px;
    cursor:pointer;
    display:none;
  }
  button.next.show{ display:inline-block; }
  button.next:hover{ background:var(--accent-strong); }
  button.next:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  /* results */
  .results h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:2.2rem;
    margin:0 0 .2rem;
    letter-spacing:.01em;
  }
  .results .sub{
    color:var(--ink-soft);
    margin:0 0 1.5rem;
    font-size:.95rem;
  }
  .scoreband{
    display:flex;
    align-items:baseline;
    gap:1rem;
    padding:1.2rem 1.4rem;
    border-radius:12px;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 20%, var(--bg-elev)), var(--bg-elev));
    border:1px solid var(--card-border);
    margin-bottom:1.5rem;
  }
  .scoreband .num{
    font-family:'JetBrains Mono', monospace;
    font-size:2.6rem;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .scoreband .meta{ display:flex; flex-direction:column; gap:.2rem; }
  .scoreband .rank{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--accent-strong);
  }
  .scoreband .note{ font-size:.78rem; color:var(--ink-faint); }

  table.metryczka{
    width:100%;
    border-collapse:collapse;
    font-size:.85rem;
  }
  table.metryczka th{
    text-align:left;
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    border-bottom:1px solid var(--card-border);
    padding:.4rem .5rem;
  }
  table.metryczka td{
    border-bottom:1px solid var(--line);
    padding:.55rem .5rem;
    vertical-align:top;
  }
  table.metryczka td.q{ max-width:280px; }
  table.metryczka td.ref-cell{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  table.metryczka td.verdict-cell{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    white-space:nowrap;
  }
  .v-ok{ color:var(--good); }
  .v-no{ color:var(--bad); }
  .table-wrap{ overflow-x:auto; margin-top: 1rem; }

  .restart{
    margin-top:1.75rem;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:1rem;
    background:transparent;
    color:var(--accent-strong);
    border:1.5px solid var(--accent);
    padding:.65rem 1.3rem;
    border-radius:9px;
    cursor:pointer;
  }
  .restart:hover{ background: color-mix(in srgb, var(--accent) 14%, transparent); }

  footer.credit{
    margin-top:2.5rem;
    text-align:center;
    color:var(--ink-faint);
    font-size:.75rem;
    font-family:'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    .opt{ transition:none; }
  }
</style>

    {"id":2,"chapter":"Rozdział 1","q":"Zgodnie z zasadą „stylu wolnego”, czego nie wolno wyznaczać na torze po sygnale startowym (poza wyjątkami)?","o":["Obowiązkowych przeładowań ani określonych postaw/stanowisk strzeleckich","Kolejności ostrzeliwania celów","Maksymalnego czasu przebiegu","Rodzaju używanej amunicji"],"c":0,"ref":"przepis 1.1.4","refText":"Po sygnale startowym na torach nie wolno wyznaczać obowiązkowych przeładowań (zmian magazynka) ani nakazywać określonych pozycji, postaw i stanowisk strzeleckich – z wyjątkami dla torów krótkich i klasyfikacyjnych."},

    {"id":5,"chapter":"Rozdział 1","q":"Ile maksymalnie strzałów może wymagać „tor długi”?","o":["24","28","32","40"],"c":2,"ref":"przepis 1.2.1.3","refText":"„Tory długie” - na których wymaga się nie więcej niż 32 strzałów. Projekt i zabudowa toru nie może wymagać więcej niż 9 punktowanych trafień z jednego stanowiska."},
    {"id":6,"chapter":"Rozdział 1","q":"Jaki jest zatwierdzony stosunek liczby torów krótkich do średnich i długich na sankcjonowanych zawodach IPSC?","o":["1 : 1 : 1","2 : 2 : 1","3 : 2 : 1","4 : 1 : 1"],"c":2,"ref":"przepis 1.2.1.4","refText":"Zawody IPSC (sankcjonowane), powinny zawierać tory w zaaprobowanym stosunku 3 krótkich torów do 2 średnich i 1 długiego."},
    {"id":7,"chapter":"Rozdział 1","q":"Ile maksymalnie strzałów może wymagać jeden zestaw celów na torze pojedynkowym (shoot-off)?","o":["8","10","12","16"],"c":2,"ref":"przepis 1.2.2.2","refText":"Każdy zestaw celów w shoot-off nie może wymagać oddania więcej niż 12 strzałów, a każdy zawodnik musi wykonać obowiązkowe przeładowanie po strzale do pierwszego, a przed strzałem do ostatniego celu."},
    {"id":8,"chapter":"Rozdział 2","q":"Ile wynosi maksymalny kąt odchylenia lufy w dowolnym kierunku (mierzony od przodu zawodnika w kierunku kulochwytu), o ile nie ustalono inaczej?","o":["45°","60°","90°","180°"],"c":2,"ref":"przepis 2.1.2","refText":"O ile nie jest to inaczej określone, maksymalny kąt odchylenia lufy w dowolnym kierunku wynosi 90°, mierzony od przodu zawodnika ustawionego dokładnie w kierunku środka strzelnicy. Skutkiem przekroczenia jest dyskwalifikacja."},
    {"id":9,"chapter":"Rozdział 2","q":"Jaka jest minimalna bezpieczna odległość zawodników i sędziów od celów metalowych podczas strzelania?","o":["3 m","5 m","7 m","10 m"],"c":2,"ref":"przepis 2.1.3","refText":"Jeśli na torze przewidziane są metalowe cele lub przesłony, należy zapewnić, by zawodnicy i sędziowie znajdowali się w chwili strzelania w odległości minimum 7 metrów od nich."},
    {"id":10,"chapter":"Rozdział 2","q":"Jeśli bezpieczny dystans od celów metalowych wyznacza linia błędu, w jakiej odległości od celu należy ją umieścić?","o":["7 m","8 m","9 m","10 m"],"c":1,"ref":"przepis 2.1.3","refText":"Jeśli dystans wyznaczany jest linią błędu, należy ją umieścić w odległości 8 metrów – tak by zawodnik, nawet w wypadku jej przekroczenia, zachował bezpieczną odległość 7 metrów."},
    {"id":11,"chapter":"Rozdział 2","q":"Jaki minimalny dystans musi dzielić zawodników strzelających jednocześnie ze wspólnej linii otwarcia ognia (np. w shoot-off)?","o":["1 m","2 m","3 m","5 m"],"c":2,"ref":"przepis 2.1.7","refText":"Jeśli tor wymaga strzelania ze wspólnej linii otwarcia ognia przez więcej niż jednego zawodnika, należy zapewnić dystans minimum 3 metrów pomiędzy zawodnikami."},

    {"id":13,"chapter":"Rozdział 2","q":"Na jaką wysokość ponad powierzchnię gruntu muszą wystawać linie błędu?","o":["1 cm","2 cm","5 cm","10 cm"],"c":1,"ref":"przepis 2.2.1.4","refText":"Linie błędu muszą być solidnie zamocowane do podłoża, muszą wystawać na 2 cm powyżej powierzchni gruntu i powinny mieć jednolity, preferowany czerwony kolor."},
    {"id":14,"chapter":"Rozdział 2","q":"Jaka jest minimalna długość odcinka linii błędu, jeśli nie otacza ona całkowicie granic pola ostrzału?","o":["1 m","1,5 m","2 m","3 m"],"c":1,"ref":"przepis 2.2.1.4","refText":"Jeżeli nie otaczają całkowicie granic pola ostrzału, linie błędu muszą mieć minimum 1,5 m długości i są wtedy uważane za ciągnące się w nieskończoność."},
    {"id":15,"chapter":"Rozdział 2","q":"Jaka jest maksymalna dopuszczalna wysokość przeszkody budowanej na torze?","o":["1 m","1,5 m","2 m","Przepisy nie ograniczają wysokości"],"c":2,"ref":"przepis 2.2.2","refText":"Wysokość przeszkody nie może przekraczać 2 metrów, a jeśli przeszkoda jest wyższa niż 1 metr, obowiązkiem jest zapewnienie fizycznych pomocy ułatwiających jej pokonanie."},

    {"id":17,"chapter":"Rozdział 2","q":"Jaki materiał zrzucany w tunelu Coopera musi mieć określoną cechę, gdyby przypadkowo spadł na zawodnika?","o":["Musi być na tyle lekki, by jego upadek nie powodował urazów","Musi być pomalowany na czerwono","Musi ważyć co najmniej 5 kg","Musi być wykonany wyłącznie z metalu"],"c":0,"ref":"przepis 2.2.5","refText":"Materiał, z którego wykonane jest zadaszenie tunelu Coopera, musi być na tyle lekki, by jego upadek na strzelca nie powodował urazów."},
    {"id":18,"chapter":"Rozdział 2","q":"Kto musi zatwierdzić zmianę konstrukcji lub procedur toru dokonywaną przez sędziów?","o":["Kierownik biura obliczeń","Sędzia główny","Dowolny sędzia toru samodzielnie","Komisja Arbitrażowa"],"c":1,"ref":"przepis 2.3.1","refText":"Sędziowie mogą z dowolnego powodu dokonywać zmian konstrukcji lub procedur toru za uprzednią zgodą Sędziego głównego, dokonanych przed rozpoczęciem strzelania na danym torze."},
    {"id":19,"chapter":"Rozdział 2","q":"Do czego NIE wolno używać niestrzeżonej strefy bezpieczeństwa?","o":["Wkładania rozładowanej broni do kabury","Ćwiczeń wymiany pustego magazynka","Manipulowania amunicją bojową","Strzelania na sucho rozładowaną bronią"],"c":2,"ref":"przepis 2.4.4","refText":"Pod żadnym pozorem nie wolno się posługiwać w strefie bezpieczeństwa nabojami szkolnymi i amunicją bojową, niezależnie czy są luzem, zapakowane, czy w magazynkach lub szybko ładowaczach."},
    {"id":20,"chapter":"Rozdział 4","q":"Jaki kolor musi mieć standardowo pole punktowe papierowych tarcz IPSC?","o":["Biały","Żółto-brązowy","Czerwony","Czarny"],"c":1,"ref":"przepis 4.1.2.1","refText":"Pole punktowe tarcz IPSC musi mieć żółto-brązowy kolor, poza przypadkiem kiedy Sędzia główny uzna, że z powodu braku kontrastu z otoczeniem musi być użyty inny kolor."},
    {"id":21,"chapter":"Rozdział 4","q":"Jak muszą być oznaczone cele „nie strzelać”?","o":["Literą „N”","Symbolem „X” lub unikalnym jednolitym kolorem","Czerwonym krzyżem","Nie wymagają żadnego oznaczenia"],"c":1,"ref":"przepis 4.1.3","refText":"Cele nie strzelać muszą być wyraźnie oznakowane symbolem „X” lub być pomalowane unikalnym jednolitym kolorem odmiennym niż punktowane, na wszystkich torach zawodów."},
    {"id":22,"chapter":"Rozdział 4","q":"Które zestawienie celów w JEDNYM zestawie jest zabronione?","o":["Tarcze IPSC z poperami IPSC","Małe tarcze IPSC z małymi poperami IPSC","Tarcze IPSC z małymi tarczami IPSC","Tarcze IPSC z małymi poperami IPSC"],"c":2,"ref":"przepis 4.1.1.2","refText":"W tym samym zestawie nie mogą znajdować się razem: Tarcze IPSC i małe tarcze IPSC, lub Popery IPSC i małe popery IPSC."},
    {"id":23,"chapter":"Rozdział 4","q":"Czy dozwolone jest wyznaczanie dwóch celów na jednej nieprzeciętej tarczy poprzez podział taśmą lub farbą?","o":["Tak, jeśli granica jest wyraźnie zaznaczona","Tak, ale tylko na torach długich","Nie, jest to zabronione","Tak, za zgodą Sędziego głównego"],"c":2,"ref":"przepis 4.1.5","refText":"Nie wolno wyznaczać dwóch celów na jednej nieprzeciętej tarczy przez dzielenie jej taśmą, farbą, ani w żaden inny sposób, ani przymocowywać małej tarczy do tarczy o pełnym wymiarze."},
    {"id":24,"chapter":"Rozdział 4","q":"Jak szerokie musi być niepunktowane obrzeże na standardowej (dużej) papierowej tarczy IPSC?","o":["0,2 cm","0,3 cm","0,5 cm","1 cm"],"c":2,"ref":"przepis 4.2.2","refText":"Tarcze papierowe muszą mieć linie pola punktowego i 0,5 cm (małe tarcze 0,3 cm) niepunktowanego obrzeża wyraźnie oznaczone na przedzie tarczy."},
    {"id":25,"chapter":"Rozdział 4","q":"Co musi się stać z celem metalowym, aby trafienie w niego zostało zaliczone?","o":["Musi wydać charakterystyczny dźwięk","Musi się przewrócić lub upaść","Wystarczy samo trafienie, niezależnie od reakcji celu","Musi przesunąć się o co najmniej 10 cm"],"c":1,"ref":"przepis 4.3.1.4","refText":"Aby zaliczyć punkty za trafienie celu metalowego, musi się on po trafieniu przewrócić lub upaść."},
    {"id":26,"chapter":"Rozdział 4","q":"Czy metalowe płytki (nieuwzględniające współczynnika mocy amunicji) mogą być jedynymi celami na torze?","o":["Tak, zawsze","Nie – na torze musi być co najmniej jeden zatwierdzony cel papierowy lub poper","Tak, ale tylko na torach krótkich","Tak, za zgodą Kierownika zawodów"],"c":1,"ref":"przepis 4.3.3.3","refText":"Płytki metalowe nie mogą być użyte jako jedyne cele na torze. Na każdym torze musi być zastosowany co najmniej jeden zatwierdzony oceniany cel papierowy lub oceniany poper."},
    {"id":27,"chapter":"Rozdział 4","q":"Czy cele łamliwe (np. rzutki śrutowe) są autoryzowane w zawodach pistoletowych IPSC?","o":["Tak, na wszystkich zawodach","Nie, nie są autoryzowanymi celami","Tak, ale tylko poziom I i II","Tak, za zgodą Dyrektora Regionalnego"],"c":1,"ref":"przepis 4.5.1","refText":"Cele łamliwe, takie jak rzutki śrutowe lub kafelki, nie są autoryzowanymi celami na zawodach pistoletowych IPSC."},
    {"id":28,"chapter":"Rozdział 5","q":"Jaka jest minimalna średnica pocisku dopuszczonego do użytku w zawodach pistoletowych IPSC?","o":["7 mm","8 mm","9 mm (.354 cala)","10 mm"],"c":2,"ref":"przepis 5.1.2","refText":"Najmniejsze wymiary łuski naboju dopuszczalnego w zawodach IPSC to 9 x 19 mm. Minimalna średnica pocisku dopuszczanego do użytku w zawodach IPSC to 9 mm (.354 in.)."},
    {"id":29,"chapter":"Rozdział 5","q":"Czy celowniki laserowe montowane na broni są dozwolone w zawodach IPSC?","o":["Tak, we wszystkich klasach","Tak, wyłącznie w klasie Open","Nie, są zabronione","Tak, za zgodą Sędziego głównego"],"c":2,"ref":"przepis 5.1.3.3","refText":"„Celowniki laserowe” – przyrządy celownicze montowane na broni, które rzucają wiązkę na cel, zapewniając widoczny punkt odniesienia. Są niedozwolone w zawodach IPSC."},
    {"id":30,"chapter":"Rozdział 5","q":"Czy w IPSC obowiązują ogólne ograniczenia siły oporu spustu broni?","o":["Tak, zawsze minimum 2,27 kg","Nie, chyba że nakładają je przepisy konkretnej klasy sprzętowej","Tak, zawsze maksymalnie 1,36 kg","Nie, żadna klasa nie ustala ciężaru spustu"],"c":1,"ref":"przepis 5.1.4","refText":"Nie obowiązują ograniczenia co do siły oporu spustu broni, o ile poszczególne klasy ich nie nakładają. W każdym wypadku mechanizm spustowy musi funkcjonować w sposób zapewniający bezpieczeństwo strzelania."},
    {"id":31,"chapter":"Rozdział 5","q":"Czy broń krótka może mieć zamocowaną kolbę lub przedni chwyt?","o":["Tak, w klasie Open","Tak, we wszystkich klasach","Nie, jest to zabronione","Tak, za zgodą Sędziego głównego"],"c":2,"ref":"przepis 5.1.10","refText":"Zabrania się używania kolb lub przednich chwytów na broni krótkiej."},
    {"id":32,"chapter":"Rozdział 5","q":"Ile jednostek broni palnej może mieć przy sobie zawodnik w trakcie przebiegu na torze?","o":["Tylko jedną","Maksymalnie dwie","Bez ograniczeń, jeśli są rozładowane","Zależy od klasy sprzętowej"],"c":0,"ref":"przepis 5.1.9","refText":"Zawodnik w czasie przebiegu na torze nie może w żadnym momencie mieć przy sobie lub używać więcej niż jednej jednostki broni palnej."},
    {"id":33,"chapter":"Rozdział 5","q":"W jakim stanie musi mieć pistolet gniazdo magazynka i kurek/iglicę, gdy jest przenoszony w kaburze?","o":["Gniazdo magazynka puste, kurek/iglica zwolniona","Gniazdo magazynka pełne, kurek napięty","Nie ma wymogów co do stanu broni w kaburze","Komora nabojowa pusta, magazynek wyjęty"],"c":0,"ref":"przepis 5.2.1.2","refText":"Pistolet przenoszony w kaburze musi mieć puste gniazdo magazynka, a kurek/iglica/bijnik musi być zwolniony."},
    {"id":34,"chapter":"Rozdział 5","q":"Na jakiej wysokości musi być noszony pas z kaburą, o ile pisemny opis toru nie stanowi inaczej?","o":["Na wysokości ud","Na wysokości talii","Dowolnie, wedle uznania zawodnika","Na wysokości klatki piersiowej"],"c":1,"ref":"przepis 5.2.3","refText":"O ile pisemny opis toru nie stanowi inaczej, pas, na którym noszona jest kabura i reszta wyposażenia strzeleckiego, musi być noszony na wysokości talii."},
    {"id":35,"chapter":"Rozdział 5","q":"Jak daleko od stóp zawodnika (w pozycji swobodnej) może celować wylot lufy pistoletu włożonego do kabury?","o":["Nie dalej niż 0,5 m","Nie dalej niż 1 m","Nie dalej niż 1,5 m","Nie ma ograniczenia"],"c":1,"ref":"przepis 5.2.7.3","refText":"Zabroniona jest kabura, która pozwala wylotowi lufy włożonego do niej pistoletu celować dalej niż o 1 metr od stóp zawodnika stojącego w swobodnej pozycji pionowej."},
    {"id":36,"chapter":"Rozdział 5","q":"Które z poniższych rodzajów amunicji są wyraźnie zakazane w zawodach IPSC?","o":["Amunicja subsoniczna","Pociski przeciwpancerne, zapalające i/lub smugowe","Amunicja z pociskiem ołowianym","Amunicja przeładowana (reload)"],"c":1,"ref":"przepis 5.5.4","refText":"W zawodach IPSC zakazane jest użycie pocisków przeciwpancernych, zapalających i/lub amunicji smugowej."},
    {"id":37,"chapter":"Rozdział 5","q":"Jak nazywają się dwa progi współczynnika mocy amunicji stosowane w IPSC?","o":["Light i Heavy","Minor i Major","Standard i Enhanced","Basic i Elite"],"c":1,"ref":"przepis 5.6.1.1–5.6.1.2","refText":"Współczynnik mocy pozwalający zaliczyć wynik zawodnika nosi nazwę Minor. Niektóre klasy przewidują wyższy współczynnik mocy noszący nazwę Major, który daje więcej punktów za trafienia w zewnętrzne strefy."},
    {"id":38,"chapter":"Rozdział 5","q":"W jakich granicach tolerancji musi mieścić się codzienna średnia prędkość zmierzona na chronografie względem wartości bazowej z pierwszego dnia?","o":["+/- 2%","+/- 5%","+/- 10%","+/- 15%"],"c":1,"ref":"przepis 5.6.2.3","refText":"Chronograf mieści się w granicach tolerancji, jeśli codzienna średnia prędkość mieści się w granicy +/– 5% średniej prędkości ustalonej pierwszego dnia zawodów."},
    {"id":39,"chapter":"Rozdział 5","q":"Ile nabojów pobiera się od zawodnika na początku próbki do testowania na chronografie?","o":["3","5","8","10"],"c":2,"ref":"przepis 5.6.3.2","refText":"Na początku próbka 8 nabojów do testowania na chronografie zostanie pobrana od zawodnika w czasie i miejscu wybranym przez funkcyjnych strzelnicy."},
    {"id":40,"chapter":"Rozdział 5","q":"Według jakiego wzoru oblicza się współczynnik mocy amunicji?","o":["masa pocisku (g) × prędkość / 100","masa pocisku (grany) × średnia prędkość (stopy/s) / 1000","prędkość / masa pocisku × 1000","(masa pocisku + prędkość) / 2"],"c":1,"ref":"przepis 5.6.3.5","refText":"Współczynnik mocy = masa pocisku (w granach) × średnia prędkość (w stopach/sekundę) / 1000. Ostateczny rezultat bierze pod uwagę jedynie liczby całkowite, ignorując ułamek."},
    {"id":41,"chapter":"Rozdział 5","q":"Ile maksymalnie czasu ma zawodnik na usunięcie zacięcia broni, zanim musi przerwać czynności i powiadomić sędziego?","o":["30 sekund","1 minuta","2 minuty","5 minut"],"c":2,"ref":"przepis 5.7.3","refText":"Jeśli czas wymagany do usunięcia awarii przekroczy 2 minuty, zawodnik ma obowiązek skierować broń w bezpiecznym kierunku i powiadomić o tym sędziego, który przerwie przebieg."},
    {"id":42,"chapter":"Rozdział 6","q":"Ile minimum torów musi zawierać oficjalne „zawody” IPSC?","o":["1 tor","2 tory","3 tory","5 torów"],"c":2,"ref":"przepis 6.1.3","refText":"Zawody - Składają się z minimum 3 torów, gdzie na wszystkich torach używamy tego samego typu broni. Wyniki zawodów określa się przez dodanie rezultatów z poszczególnych torów."},
    {"id":43,"chapter":"Rozdział 6","q":"Czym różni się „Turniej” od „Wielkiego Turnieju” w terminologii IPSC?","o":["Turniej przypisuje różne tory do jednego rodzaju broni; Wielki Turniej łączy wyniki kilku odrębnych zawodów","Nie ma różnicy, to synonimy","Turniej dotyczy tylko pistoletu, Wielki Turniej tylko karabinu","Wielki Turniej to zawody dla jednej osoby"],"c":0,"ref":"przepis 6.1.4–6.1.5","refText":"Turniej – tory przypisane są do jednego, określonego rodzaju broni. Wielki Turniej - strzelanie złożone z dwóch lub więcej oddzielnych zawodów, których wyniki łącznie wyłaniają zwycięzcę."},
    {"id":44,"chapter":"Rozdział 6","q":"Ile maksymalnie zawodników może liczyć drużyna IPSC (poza Drużyną Rodzinną), i ile najlepszych wyników liczy się do klasyfikacji?","o":["3 zawodników — liczą się wszystkie 3 wyniki","4 zawodników — liczą się 3 najlepsze wyniki","5 zawodników — liczą się 4 najlepsze wyniki","4 zawodników — liczą się wszystkie 4 wyniki"],"c":1,"ref":"przepis 6.4.3","refText":"Z wyjątkiem Drużyny Rodzinnej, drużyna składa się z maksymalnie 4 zawodników. Jednak do obliczenia wyniku końcowego liczą się wyniki jedynie trzech najlepszych z nich."},
    {"id":45,"chapter":"Rozdział 6","q":"Z ilu zawodników składa się Drużyna Rodzinna?","o":["2","3","4","5"],"c":0,"ref":"przepis 6.4.3","refText":"Drużyna Rodzinna składa się z 2 zawodników (patrz załącznik A2)."},
    {"id":46,"chapter":"Rozdział 6","q":"Ile dni w ciągu 12 miesięcy poprzedzających zawody trzeba przebywać w danym regionie, by uznać go za kraj stałego zamieszkania zawodnika?","o":["90 dni","120 dni","183 dni","270 dni"],"c":2,"ref":"przepis 6.5.1","refText":"Za kraj stałego zamieszkiwania uznaje się region, w którym zawodnik przebywał nie mniej niż 183 dni w ciągu 12 miesięcy poprzedzających miesiąc rozpoczęcia zawodów."},
    {"id":47,"chapter":"Rozdział 7","q":"Który funkcyjny zawodów sprawuje ogólną władzę nad wszystkimi osobami i działaniami na strzelnicy, w tym nad bezpieczeństwem i przestrzeganiem przepisów?","o":["Kierownik zawodów (Match Director)","Sędzia główny (Range Master)","Kierownik toru (CRO)","Kierownik biura obliczeń (Stats Officer)"],"c":1,"ref":"przepis 7.1.5","refText":"Sędzia główny (Range Master, RM) - sprawuje ogólną władzę nad wszystkimi osobami i działaniami na terenie strzelnicy w trakcie trwania zawodów. Rozpatruje każdą dyskwalifikację i odwołanie od decyzji sędziów."},
    {"id":48,"chapter":"Rozdział 7","q":"Który funkcyjny zawodów nadzoruje dystrybucję, naprawy i utrzymanie wyposażenia torów (np. tarcze, zaklejki, farba)?","o":["Kierownik biura zaopatrzenia (Quartermaster)","Kierownik toru (CRO)","Kierownik biura obliczeń (Stats Officer)","Sędzia przebiegu (RO)"],"c":0,"ref":"przepis 7.1.4","refText":"Kierownik biura zaopatrzenia (Quartermaster, QM) - nadzoruje dystrybucję, naprawy i utrzymanie wszelkiego wyposażenia torów oraz uzupełnia zaopatrzenie sędziów w wodę i prowiant."},
    {"id":49,"chapter":"Rozdział 7","q":"Na zawodach jakiego poziomu dopuszcza się, by jedna osoba pełniła jednocześnie funkcję Kierownika zawodów i Sędziego głównego?","o":["Wyłącznie poziomu V","Poziomu I i II","Poziomu III i IV","Nigdy nie jest to dopuszczalne"],"c":1,"ref":"przepis 7.3.1","refText":"Na zawodach poziomu I i II dopuszcza się, by jedna osoba pełniła jednocześnie obowiązki Kierownika zawodów i Sędziego głównego."},
    {"id":50,"chapter":"Rozdział 8","q":"Co oznacza określenie stanu gotowości „Bez samo-napinania (Single Action, SA)” dla broni krótkiej?","o":["Nacisk na spust powoduje tylko jeden skutek – opadnięcie napiętego kurka","Nacisk na spust najpierw napina, a potem zwalnia kurek","Broń może funkcjonować w obu trybach naraz","Kurek jest zawsze odsłonięty i napięty ręcznie przed każdym strzałem"],"c":0,"ref":"przepis 8.1.5.1","refText":"Bez samo-napinania (Single Action, SA) oznacza, że nacisk na spust powoduje tylko jeden skutek – opadnięcie napiętego kurka lub uderzenie napiętej iglicy (bijnika)."},
    {"id":51,"chapter":"Rozdział 8","q":"Czego zawodnikowi nie wolno robić pomiędzy komendą „Uwaga” a sygnałem startowym?","o":["Oddychać głęboko","Dotykać lub trzymać broni/amunicji (poza naturalnym styku)","Patrzeć na cele","Stać nieruchomo"],"c":1,"ref":"przepis 8.2.3","refText":"Opis przebiegu nie może w żadnym wypadku wymagać ani zezwalać zawodnikowi na dotykanie lub trzymanie broni lub amunicji pomiędzy komendą „Uwaga” i sygnałem startowym."},
    {"id":52,"chapter":"Rozdział 8","q":"Czy opis toru może zmuszać zawodnika do ponownego chowania broni do kabury po sygnale startowym?","o":["Tak, zawsze gdy tor tego wymaga","Nie, jest to zabronione","Tak, ale tylko na torach krótkich","Tak, za zgodą sędziego przebiegu"],"c":1,"ref":"przepis 8.2.5","refText":"Opis toru w żadnym wypadku nie może wymagać, by zawodnik ponownie wkładał broń do kabury po sygnale startowym. Naruszenie skutkuje dyskwalifikacją."},
    {"id":53,"chapter":"Rozdział 8","q":"Ile sekund po komendzie „Uwaga” (Standby) powinien nastąpić sygnał startowy?","o":["0–1 s","1–4 s","2–6 s","5–10 s"],"c":1,"ref":"przepis 8.3.3","refText":"„Uwaga” (Standby) - po tej komendzie sygnał startowy powinien nastąpić w ciągu od 1 do 4 sekund."},
    {"id":54,"chapter":"Rozdział 8","q":"Jaka jest poprawna kolejność komend kończących przebieg zawodnika na torze?","o":["„Stop” → „Strzelnica jest wolna” → „Uwaga”","„Jeśli skończyłeś, rozładuj i pokaż do sprawdzenia” → „Jeśli rozładowałeś, strzał kontrolny, kabura” → „Strzelnica jest wolna”","„Strzelnica jest wolna” → „Rozładuj broń” → „Kabura”","„Kabura” → „Rozładuj” → „Strzelnica jest wolna”"],"c":1,"ref":"przepis 8.3.6–8.3.8","refText":"Kolejność komend: „Jeśli skończyłeś, rozładuj i pokaż do sprawdzenia”, następnie „Jeśli rozładowałeś, strzał kontrolny, kabura”, a na końcu „Strzelnica jest wolna”."},
    {"id":55,"chapter":"Rozdział 8","q":"Zawodnik, który zareagował na sygnał startu, ale nie ma zarejestrowanego czasu na oficjalnym timerze, otrzymuje na tym torze:","o":["Powtórzenie przebiegu bez kar","Zerowy czas i zerowy wynik przebiegu","Karę proceduralną, ale wynik się liczy","Automatyczną dyskwalifikację"],"c":1,"ref":"przepis 8.3.4.2","refText":"Jeśli zawodnik zareaguje na sygnał startu, ale z jakiegokolwiek powodu nie ma zarejestrowanego czasu na oficjalnym timerze, uzyskuje zerowy czas przebiegu i zerowy wynik na tym torze."},
    {"id":56,"chapter":"Rozdział 8","q":"Co należy uznać za „przemieszczanie się” na torze w rozumieniu przepisów?","o":["Wyłącznie bieg","Przejście co najmniej jednego kroku lub zmianę postawy strzeleckiej","Wyłącznie przejście na inne stanowisko strzeleckie oznaczone linią błędu","Każdy ruch tułowia podczas strzelania"],"c":1,"ref":"przepis 8.5.1","refText":"Za „przemieszczanie się” uznaje się m.in.: przejście co najmniej jednego kroku w dowolnym kierunku, oraz zmianę postawy strzeleckiej (np. z „stojąc” do „klęcząc”)."},
    {"id":57,"chapter":"Rozdział 8","q":"Czy zawodnikom wolno sprawdzać ustawienie przyrządów celowniczych lub strzelać na sucho przed sygnałem startowym?","o":["Tak, bez ograniczeń","Nie, jest to zabronione (za pierwszym razem ostrzeżenie, potem kara)","Tak, ale tylko raz na zawodach","Tak, jeśli sędzia wyrazi zgodę"],"c":1,"ref":"przepis 8.7.1","refText":"Zawodnikom zabrania się sprawdzania ustawienia przyrządów celowniczych i/lub strzelania na sucho przed sygnałem startowym. Złamanie zakazu skutkuje za pierwszym razem ostrzeżeniem, za każdym następnym – karą proceduralną."},
    {"id":58,"chapter":"Rozdział 9","q":"O ile pisemny opis toru nie stanowi inaczej, ile trafień w papierowy cel punktowany liczy się do punktacji?","o":["Tylko jedno, najlepsze","Dwa najlepsze","Wszystkie oddane trafienia","Trzy najlepsze"],"c":1,"ref":"przepis 9.5.1","refText":"O ile pisemny opis toru nie stanowi inaczej, w każdy punktowany cel papierowy należy strzelić minimum jeden raz, a do punktacji liczą się dwa najlepsze trafienia."},
    {"id":59,"chapter":"Rozdział 9","q":"Jak ocenia się trafienie, które dotyka linii podziału dwóch stref punktowych?","o":["Zalicza się niższą z możliwych wartości","Zalicza się najwyższą z możliwych wartości","Trafienie jest anulowane","Sędzia losowo wybiera wartość"],"c":1,"ref":"przepis 9.5.2","refText":"Jeśli trafienie dotyka linii podziału stref punktowych lub linii brzegowej między obwódką a polem punktowym, zalicza się najwyższą z możliwych wartości punktowych."},
    {"id":60,"chapter":"Rozdział 9","q":"Na jaką minimalną odległość od tarcz nie wolno się zbliżać zawodnikowi (lub jego delegatowi) podczas oceniania celów, bez zezwolenia sędziego?","o":["0,5 m","1 m","2 m","3 m"],"c":1,"ref":"przepis 9.1.1","refText":"W czasie oceniania celów zawodnikom lub ich delegatom nie wolno zbliżać się do tarcz bliżej niż na 1 m bez zezwolenia sędziego."},
    {"id":61,"chapter":"Rozdział 9","q":"Ile punktów kary nalicza się za trafienie widoczne w polu punktowym celu „nie strzelać”?","o":["-5 pkt","-10 pkt","-15 pkt","-20 pkt"],"c":1,"ref":"przepis 9.4.2–9.4.3","refText":"Trafienia widoczne w polu punktowym papierowego lub metalowego celu nie strzelać skutkują karą minus 10 punktów."},
    {"id":62,"chapter":"Rozdział 9","q":"Dla ilu maksymalnie trafień w jeden cel „nie strzelać” nalicza się karę?","o":["Jednego","Dwóch","Trzech","Bez ograniczeń – liczą się wszystkie trafienia"],"c":1,"ref":"przepis 9.4.2","refText":"W każdym celu nie strzelać kary nalicza się dla maksymalnie dwóch trafień."},
    {"id":63,"chapter":"Rozdział 9","q":"Jaki jest minimalny możliwy wynik zawodnika na pojedynczym torze?","o":["Wynik może być ujemny","Zero","Zależy od liczby celów na torze","Minimum to liczba wymaganych trafień"],"c":1,"ref":"przepis 9.5.5","refText":"Minimalny wynik na torze wynosi zero."},
    {"id":64,"chapter":"Rozdział 9","q":"Jak IPSC rozstrzyga remisy w wynikach zawodów?","o":["Przez losowanie","Przez dodatkowe strzelanie (shoot-off) na wyznaczonym torze","Zwycięża zawodnik z niższym numerem startowym","Remisu nigdy się nie rozstrzyga"],"c":1,"ref":"przepis 9.3.1","refText":"Zawodnicy z identycznym wynikiem muszą wykonać jeden lub więcej przebiegów na torze wskazanym przez Kierownika zawodów. Nie wolno rozstrzygać remisów przez losowanie."},
    {"id":65,"chapter":"Rozdział 9","q":"Kto może zostać oceniony za zawodnika jako mierzący oficjalny czas przebiegu na torze?","o":["Sam zawodnik na swoim własnym stoperze","Tylko urządzenie do pomiaru czasu obsługiwane przez sędziego","Dowolny widz z zegarkiem","Elektroniczny system celów"],"c":1,"ref":"przepis 9.10.1","refText":"Tylko urządzenie do pomiaru czasu obsługiwane przez sędziego może służyć do mierzenia oficjalnego czasu przebiegu zawodnika na torze."},
    {"id":66,"chapter":"Rozdział 9","q":"Jakie oficjalne programy do obliczania punktacji stosuje się na zawodach poziomu IV lub wyższego?","o":["Excel i Google Sheets","WinMSS i IPSC ESS","PractiScore wyłącznie","Dowolny program wskazany przez zawodnika"],"c":1,"ref":"przepis 9.11.1","refText":"Oficjalnymi programami do obliczania punktacji na wszystkich zawodach o poziomie IV lub wyższym są ostatnie wersje Windows® Match Scoring System (WinMSS) i IPSC ESS."},
    {"id":67,"chapter":"Rozdział 10","q":"Ile punktów wynosi wartość jednej kary proceduralnej?","o":["-5 pkt","-10 pkt","-15 pkt","-20 pkt"],"c":1,"ref":"przepis 10.1.2","refText":"Wartość jednej kary proceduralnej jest równa minus 10 pkt."},
    {"id":68,"chapter":"Rozdział 10","q":"Zawodnik, który poruszy element zadaszenia w Tunelu Coopera i element ten spadnie, otrzymuje:","o":["Dyskwalifikację","Jedną karę proceduralną za każdy spadający element","Ostrzeżenie bez kary punktowej","Karę zerowego przebiegu"],"c":1,"ref":"przepis 10.2.5","refText":"W tunelu Coopera zawodnik, który poruszy jeden lub więcej elementów zadaszenia, otrzyma jedną karę proceduralną za każdy element, który spadnie."},
    {"id":69,"chapter":"Rozdział 10","q":"Co grozi zawodnikowi, który między komendą „Uwaga” a sygnałem startowym zmienia ustawienie rąk, by łatwiej sięgnąć po broń (tzw. creeping)?","o":["Automatyczna dyskwalifikacja","Jedna kara proceduralna","Powtórzenie przebiegu bez konsekwencji","Odjęcie 50 punktów"],"c":1,"ref":"przepis 10.2.6","refText":"Zawodnik, który między komendą „Uwaga” a sygnałem startowym zmienia ustawienie rąk uzyskując łatwiejszy dostęp do broni lub amunicji (creeping), zostanie ukarany jedną karą proceduralną."},
    {"id":70,"chapter":"Rozdział 10","q":"Strzał trafiający w ziemię w jakiej odległości od zawodnika uznawany jest (poza wyjątkami) za strzał przypadkowy skutkujący dyskwalifikacją?","o":["Bliżej niż 1 m","Bliżej niż 2 m","Bliżej niż 3 m","Bliżej niż 5 m"],"c":2,"ref":"przepis 10.4.2","refText":"Strzał, w wyniku którego pocisk uderza w ziemię bliżej niż 3 m od zawodnika – z wyjątkiem strzału skierowanego do celu papierowego umieszczonego bliżej niż 3 m – skutkuje dyskwalifikacją."},
    {"id":71,"chapter":"Rozdział 10","q":"Czy strzał padający w czasie ładowania, przeładowania lub rozładowania broni jest karany dyskwalifikacją?","o":["Nie, nigdy","Tak, uznaje się go za strzał przypadkowy","Tylko jeśli trafił w cel","Tylko na torach krótkich"],"c":1,"ref":"przepis 10.4.3","refText":"Strzał padający w czasie wykonywania czynności ładowania, przeładowania lub rozładowania broni uznawany jest za strzał przypadkowy i skutkuje dyskwalifikacją."},
    {"id":72,"chapter":"Rozdział 10","q":"Kto powinien podnieść upuszczoną, załadowaną broń na torze?","o":["Sam zawodnik","Wyłącznie sędzia","Następny startujący zawodnik","Nikt — broń zostaje na miejscu do końca zawodów"],"c":1,"ref":"przepis 10.5.15","refText":"Broń upuszczoną podnosi zawsze sędzia, który po przejrzeniu broni umieści ją w pokrowcu, torbie lub kaburze zawodnika. Zawodnik, który sam podnosi upuszczoną broń, będzie zdyskwalifikowany."},
    {"id":73,"chapter":"Rozdział 10","q":"Jaka jest konsekwencja dla osoby uznanej przez sędziego za będącą pod wpływem alkoholu w czasie trwania zawodów?","o":["Ostrzeżenie","Kara proceduralna","Dyskwalifikacja","Zawieszenie na kolejne zawody"],"c":2,"ref":"przepis 10.7.3","refText":"Osoba znajdująca się zdaniem sędziego pod wpływem alkoholu lub innych środków psychoaktywnych zostanie zdyskwalifikowana i może zostać usunięta ze strzelnicy."},
    {"id":74,"chapter":"Rozdział 10","q":"Za co zawodnik zostanie zdyskwalifikowany zgodnie z przepisem o niesportowym zachowaniu?","o":["Za przegranie shoot-offu","Za oszustwo, nieuczciwość lub odmowę wykonania poleceń sędziego","Za niski wynik na torze","Za spóźnienie na odprawę"],"c":1,"ref":"przepis 10.6.1","refText":"Zawodnik zostanie zdyskwalifikowany za zachowanie, które sędzia uzna za niesportowe. Wybrane przykłady to: oszustwo, nieuczciwość, odmowa wykonania poleceń sędziego."},
    {"id":75,"chapter":"Rozdział 11","q":"W jakim czasie od zdarzenia będącego przyczyną sporu należy złożyć do Sędziego głównego pisemny wniosek o arbitraż?","o":["30 minut","1 godziny","2 godzin","24 godzin"],"c":1,"ref":"przepis 11.3.1","refText":"Pisemny wniosek o arbitraż należy dostarczyć Sędziemu głównemu na odpowiednim druku, załączając stosowną opłatę, w ciągu godziny od zapisanego momentu zdarzenia."},
    {"id":76,"chapter":"Rozdział 11","q":"W jakim maksymalnym czasie od złożenia wniosku Komisja Arbitrażowa musi rozstrzygnąć sprawę?","o":["1 godziny","6 godzin","24 godzin","48 godzin"],"c":2,"ref":"przepis 11.3.2","refText":"Komisja musi rozstrzygnąć sprawę w ciągu 24 godzin od złożenia wniosku, a w każdym razie przed ogłoszeniem ostatecznych wyników zawodów."},
    {"id":77,"chapter":"Rozdział 11","q":"Ile wynosi standardowa kaucja wnoszona wraz ze skargą do arbitrażu na zawodach poziomu III lub wyższych?","o":["Równowartość 50 USD","Równowartość 100 USD (lub najwyższej opłaty startowej, jeśli niższa)","Równowartość 250 USD","Kaucja nie jest wymagana"],"c":1,"ref":"przepis 11.4.1","refText":"Na zawodach poziomu III lub wyższych suma kaucji wnoszonej wraz ze skargą do arbitrażu wynosi równowartość 100 USD lub najwyższej indywidualnej opłaty startowej, jeśli jest niższa."},
    {"id":78,"chapter":"Rozdział 11","q":"Kto zajmuje się interpretacją przepisów i regulaminów IPSC?","o":["Sędzia główny każdych zawodów z osobna","Rada Wykonawcza IPSC","Kierownik zawodów","Komisja Arbitrażowa danych zawodów"],"c":1,"ref":"przepis 11.8.1","refText":"Interpretacją przepisów i regulaminów zajmuje się Rada Wykonawcza IPSC."},
    {"id":79,"chapter":"Rozdział 12","q":"Który język jest oficjalnym językiem przepisów IPSC, rozstrzygającym w razie rozbieżności z tłumaczeniem?","o":["Francuski","Hiszpański","Angielski","Włoski"],"c":2,"ref":"przepis 12.2","refText":"Język angielski jest oficjalnym językiem przepisów IPSC. Jeżeli wystąpią rozbieżności pomiędzy wersją angielską a przetłumaczoną, wiążąca jest wersja angielska."},
    {"id":80,"chapter":"Rozdział 12 (Glosariusz)","q":"Zgodnie z glosariuszem przepisów, czym jest „Squib”?","o":["Rodzaj kabury bocznej","Część naboju lub pocisk zatrzymany wewnątrz lufy albo opuszczający ją z bardzo małą prędkością","Oficjalny producent broni (OFM)","Sygnał ręczny oznaczający chybienie"],"c":1,"ref":"Glosariusz, przepis 12.5","refText":"Squib - jakakolwiek część naboju zatrzymana wewnątrz lufy i/lub pocisk opuszczający ją z bardzo małą szybkością."},
    {"id":81,"chapter":"Rozdział 12 (Glosariusz)","q":"Jak glosariusz definiuje „Sweeping”?","o":["Zamiatanie stanowiska strzeleckiego przed startem","Kierowanie wylotu lufy w jakąkolwiek część ciała zawodnika, gdy broń jest trzymana poza kaburą","Szybkie przełożenie broni z ręki do ręki","Czyszczenie lufy po zakończeniu przebiegu"],"c":1,"ref":"Glosariusz, przepis 12.5","refText":"Sweeping - kierowanie wylotu lufy broni w jakąkolwiek część ciała zawodnika podczas przebiegu na torze, kiedy jest ona trzymana bądź dotykana, a nie jest w kaburze."},
    {"id":82,"chapter":"Rozdział 12 (Glosariusz)","q":"Jak glosariusz definiuje „Engage” (ostrzeliwanie celu)?","o":["Tylko trafienie celu liczy się jako ostrzelanie","Oddanie strzału do celu, nawet bez trafienia — cel przestaje być „nieostrzelany”","Wyłącznie dotknięcie celu ręką","Ustawienie się naprzeciw celu bez oddania strzału"],"c":1,"ref":"Glosariusz, przepis 12.5","refText":"Engage - ostrzelanie celu. Oddając strzał do celu i nie trafiając, cel nie jest „nie ostrzelany”. Zacięcie broni lub amunicji uniemożliwiające oddanie strzału uważa się za „nieostrzelanie”."},
    {"id":83,"chapter":"Załącznik A1","q":"Na zawodach jakiego poziomu chronograf staje się obowiązkowy (M), a nie tylko zalecany (R)?","o":["Poziomu II","Poziomu III","Poziomu IV","Nigdy nie jest obowiązkowy"],"c":2,"ref":"Załącznik A1, poz. 15","refText":"Chronograf: poziom I – brak wymogu, poziom II i III – zalecany (R), poziom IV i V – obowiązkowy (M)."},
    {"id":84,"chapter":"Załącznik A1","q":"Ile wynosi zalecana minimalna liczba strzałów pistoletowych na zawodach poziomu V?","o":["150","300","450","600"],"c":2,"ref":"Załącznik A1, poz. 20","refText":"Zalecana minimalna ilość strzałów w konkurencji pistolet: poziom I – 40, II – 80, III – 150, IV – 300, V – 450."},
    {"id":85,"chapter":"Załącznik A2","q":"Do jakiego wieku (włącznie z rokiem, w którym się go osiąga) zawodnik kwalifikuje się do kategorii „Junior”?","o":["Do 14 lat","Do 18 lat","Do 21 lat","Do 25 lat"],"c":2,"ref":"Załącznik A2, pkt 3(f)","refText":"Junior - zawodnicy, którzy nie ukończyli 21 lat (do końca roku, w którym ukończą 21 lat)."},
    {"id":86,"chapter":"Załącznik A2","q":"Od jakiego wieku zawodnik może startować w kategorii „Super Senior”?","o":["Od 50 lat","Od 55 lat","Od 60 lat","Od 70 lat"],"c":2,"ref":"Załącznik A2, pkt 3(j)","refText":"Super Senior - zawodnicy, którzy w pierwszym dniu zawodów mają ukończone 60 lat."},
    {"id":87,"chapter":"Załącznik A2","q":"Ile minimum zawodników w klasie jest wymagane na zawodach poziomu III, by IPSC uznało wyniki tej klasy?","o":["5 (zalecane)","10 (obowiązkowo)","20 (obowiązkowo)","Nie ma wymogu na poziomie III"],"c":1,"ref":"Załącznik A2, pkt 1","refText":"Klasy: Poziom I i II – minimum 5 zawodników w klasie (zalecane); Poziom III – minimum 10 zawodników (obowiązkowo); Poziom IV i V – minimum 20 zawodników (obowiązkowo)."},
    {"id":88,"chapter":"Załącznik B2","q":"Ile punktów przyznaje się za trafienie w strefę „A” tarczy IPSC (zarówno Major, jak i Minor)?","o":["3 pkt","4 pkt","5 pkt","10 pkt"],"c":2,"ref":"Załącznik B2","refText":"Punktacja tarczy IPSC: strefa A = 5 pkt (Major i Minor), strefa C = 4 pkt (Major) / 3 pkt (Minor), strefa D = 2 pkt (Major) / 1 pkt (Minor)."},
    {"id":89,"chapter":"Załącznik B2","q":"Ile punktów przyznaje się za trafienie w strefę „D” tarczy IPSC przy współczynniku mocy Minor?","o":["4 pkt","3 pkt","2 pkt","1 pkt"],"c":3,"ref":"Załącznik B2","refText":"Punktacja tarczy IPSC dla strefy D: 2 punkty przy współczynniku Major, 1 punkt przy współczynniku Minor."},
    {"id":90,"chapter":"Załącznik C1","q":"W jakim przedziale współczynnika mocy musi mieścić się amunicja kalibracyjna używana do kalibrowania poperów IPSC?","o":["100–110","110–120","120–125","130–140"],"c":2,"ref":"Załącznik C1, pkt 2","refText":"Amunicja kalibracyjna, podczas testowania przy użyciu każdego egzemplarza broni kalibracyjnej, musi uzyskać współczynnik mocy pomiędzy 120 a 125, aby zostać zakwalifikowaną."},
    {"id":91,"chapter":"Załącznik C3","q":"Na jakiej minimalnej wysokości powinny być zamontowane płytki metalowe na zawodach pistoletowych (na słupkach lub twardej przesłonie)?","o":["0,5 m","1 m","1,5 m","2 m"],"c":1,"ref":"Załącznik C3","refText":"Na zawodach pistoletowych płytki powinny być zamontowane na twardej przesłonie lub metalowych słupkach o wysokości minimum 1 m."},
    {"id":92,"chapter":"Załącznik D1 (Open)","q":"Jaki jest minimalny współczynnik mocy Major w klasie Open?","o":["125","140","160","170"],"c":2,"ref":"Załącznik D1, pkt 1","refText":"Klasa Open: minimalna wielkość współczynnika mocy Major wynosi 160; minimalna wielkość współczynnika mocy Minor wynosi 125."},
    {"id":93,"chapter":"Załącznik D1 (Open)","q":"Czy celowniki optyczne/elektroniczne oraz kompensatory są dozwolone w klasie Open?","o":["Tak, oba są dozwolone","Nie, oba są zabronione","Dozwolone są tylko celowniki optyczne","Dozwolone są tylko kompensatory"],"c":0,"ref":"Załącznik D1, poz. 12–13","refText":"Klasa Open: optyczne/elektroniczne celowniki – tak; kompensatory, porting, tłumiki dźwięku i/lub błysku – tak."},
    {"id":94,"chapter":"Załącznik D2 (Standard)","q":"Jaki jest minimalny kaliber pocisku wymagany dla uzyskania współczynnika mocy Major w klasie Standard?","o":["9 mm (0,354”)","10 mm (0,40”)","11,43 mm (0,45”)","Nie ma minimalnego kalibru dla Major"],"c":1,"ref":"Załącznik D2, poz. 5","refText":"Klasa Standard: minimalny kaliber pocisku dla współczynnika mocy Major wynosi 10 mm (0,40”)."},
    {"id":95,"chapter":"Załącznik D2 (Standard)","q":"Jakie są wewnętrzne wymiary zamkniętego pudełka, w którym musi zmieścić się broń klasy Standard (test pudełkowy)?","o":["200 x 140 x 40 mm","225 x 150 x 45 mm","250 x 160 x 50 mm","210 x 145 x 42 mm"],"c":1,"ref":"Załącznik D2, pkt 15","refText":"Broń w stanie gotowości, rozładowana i z podpiętym pustym magazynkiem, musi w całości zmieścić się w zamkniętym pudełku o wymiarach wnętrza 225 mm x 150 mm x 45 mm (tolerancja +1 mm, -0 mm)."},
    {"id":96,"chapter":"Załącznik D3 (Classic)","q":"Ile maksymalnie nabojów może zawierać magazynek używany na torze w klasie Classic przy współczynniku mocy Major?","o":["6","8","10","15"],"c":1,"ref":"Załącznik D3, pkt 20","refText":"Magazynki używane przez zawodnika na torze, po sygnale startowym, nie mogą zawierać ponad 8 nabojów (dla współczynnika mocy Major) lub 10 (dla współczynnika mocy Minor)."},
    {"id":97,"chapter":"Załącznik D3 (Classic)","q":"Jaki wzorzec konstrukcyjny muszą wizualnie przypominać pistolety w klasie Classic?","o":["Klasyczną konstrukcję rewolweru","Klasyczne rozwiązania pistoletu 1911","Dowolny model dostępny na rynku","Wyłącznie pistolety polimerowe"],"c":1,"ref":"Załącznik D3, pkt 17","refText":"Pistolety muszą być oparte i wizualnie przypominać z profilu i obrysem rozwiązania klasycznej 1911: jednorzędowy magazynek, szkielet z jednego kawałka metalu, zamek z pałąkowatymi podcięciami."},
    {"id":98,"chapter":"Załącznik D4 (Production)","q":"Czy klasa Production przewiduje współczynnik mocy Major?","o":["Tak, minimum 170","Tak, minimum 160","Nie, klasa Production nie stosuje współczynnika Major","Tak, ale tylko dla rewolwerów"],"c":2,"ref":"Załącznik D4, poz. 1","refText":"Klasa Production: minimalna wielkość współczynnika mocy Major – nie stosuje się. Minimalna wielkość współczynnika mocy Minor – 125."},
    {"id":99,"chapter":"Załącznik D4 (Production)","q":"Jaka jest maksymalna dopuszczalna długość lufy w klasie Production?","o":["100 mm","114 mm","127 mm","140 mm"],"c":2,"ref":"Załącznik D4, poz. 7","refText":"Klasa Production: maksymalne wymiary broni – maksymalna długość lufy 127 mm."},

<script>
const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
const QUESTIONS = DATA.questions;

const state = { i:0, answered:new Array(QUESTIONS.length).fill(null) };
const main = document.getElementById('main');
const progressEl = document.getElementById('progress');
const stagecountEl = document.getElementById('stagecount');

function buildProgress(){
  progressEl.innerHTML = '';
  QUESTIONS.forEach((_,idx)=>{
    const i = document.createElement('i');
    if(state.answered[idx]!==null) i.className='done';
    else if(idx===state.i) i.className='cur';
    progressEl.appendChild(i);
  });
}

function renderQuestion(){
  const idx = state.i;
  const item = QUESTIONS[idx];
  stagecountEl.innerHTML = `TOR <b>${idx+1}</b> / ${QUESTIONS.length}`;
  buildProgress();

  const already = state.answered[idx];
  const letters = ['A','B','C','D'];

  main.innerHTML = `
    <div class="card">
      <span class="cite">${item.ref}</span>
      <p class="question">${item.q}</p>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div class="actions"><button class="next" id="nextBtn">${idx===QUESTIONS.length-1 ? 'Zobacz wynik →' : 'Następny tor →'}</button></div>
    </div>
  `;

  const optsEl = document.getElementById('opts');
  item.o.forEach((text, oi)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="tag">${letters[oi]}</span><span>${text}</span>`;
    b.disabled = already!==null;
    if(already!==null){
      if(oi===item.c) b.classList.add('correct');
      else if(oi===already) b.classList.add('wrong');
      else b.classList.add('dim');
    }
    b.addEventListener('click', ()=>selectAnswer(oi));
    optsEl.appendChild(b);
  });

  if(already!==null) showFeedback(idx, already);
}

function selectAnswer(oi){
  const idx = state.i;
  if(state.answered[idx]!==null) return;
  state.answered[idx] = oi;
  renderQuestion();
  document.getElementById('nextBtn').classList.add('show');
}

function showFeedback(idx, chosen){
  const item = QUESTIONS[idx];
  const fb = document.getElementById('fb');
  const ok = chosen===item.c;
  fb.classList.add('show', ok?'ok':'no');
  fb.innerHTML = `<span class="verdict">${ok ? 'Trafienie w A.' : 'Chybienie.'}</span>
    <div class="refquote">
      <span class="reflabel">Treść przepisu — ${item.ref}</span>
      „${item.refText}”
    </div>`;
  document.getElementById('nextBtn').classList.add('show');
}

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='nextBtn'){
    if(state.i < QUESTIONS.length-1){
      state.i++;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      renderResults();
    }
  }
  if(e.target && e.target.id==='restartBtn'){
    state.i = 0;
    state.answered = new Array(QUESTIONS.length).fill(null);
    document.getElementById('progress').style.display='';
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  }
});

function renderResults(){
  const correctCount = state.answered.reduce((s,a,idx)=> s + (a===QUESTIONS[idx].c ? 1:0), 0);
  const total = QUESTIONS.length;
  const pct = Math.round((correctCount/total)*100);
  let rank, rankNote;
  if(pct>=90){ rank='Grandmaster'; }
  else if(pct>=75){ rank='Master'; }
  else if(pct>=60){ rank='Klasa A'; }
  else if(pct>=40){ rank='Klasa B'; }
  else { rank='Klasa D — czas na powtórkę przepisów'; }
  rankNote = '(nieoficjalna skala żartobliwie nawiązująca do klasyfikacji IPSC, nie ma związku z ICS)';

  stagecountEl.innerHTML = '';
  document.getElementById('progress').style.display='none';

  const rows = QUESTIONS.map((item, idx)=>{
    const chosen = state.answered[idx];
    const ok = chosen===item.c;
    const letters = ['A','B','C','D'];
    return `<tr>
      <td class="q">${item.q}</td>
      <td>${letters[item.c]}. ${item.o[item.c]}</td>
      <td class="ref-cell">${item.ref}</td>
      <td class="verdict-cell ${ok?'v-ok':'v-no'}">${ok? 'TRAFIENIE':'CHYBIENIE'}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="card results">
      <h2>Metryczka wyników</h2>
      <p class="sub">Ukończono „Tor Przepisów” — ${total} pytań o przepisy pistoletu dynamicznego IPSC, wydanie styczeń 2026.</p>
      <div class="scoreband">
        <span class="num">${correctCount}/${total}</span>
        <div class="meta">
          <span class="rank">${rank}</span>
          <span class="note">Wynik: ${pct}% &middot; ${rankNote}</span>
        </div>
      </div>
      <div class="table-wrap">
        <table class="metryczka">
          <thead><tr><th>Pytanie</th><th>Poprawna odpowiedź</th><th>Przepis</th><th>Wynik</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <button class="restart" id="restartBtn">Strzelaj ponownie</button>
    </div>
  `;
}

renderQuestion();
</script>
