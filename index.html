<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Przepisów IPSC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F0E4;
    --bg-elev:#FDFAF3;
    --card-border:#E4D9C1;
    --ink:#241F17;
    --ink-soft:#6B6151;
    --ink-faint:#948A76;
    --accent:#A9702E;
    --accent-strong:#7C4F1C;
    --accent-ink:#FBF4E6;
    --tan:#D9BE8C;
    --good:#3E6B44;
    --good-bg:#E4EEDE;
    --bad:#A23A2C;
    --bad-bg:#F5DFD8;
    --line: rgba(36,31,23,0.14);
    --shadow: 0 1px 2px rgba(36,31,23,0.06), 0 8px 24px -12px rgba(36,31,23,0.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161209;
      --bg-elev:#1F1A10;
      --card-border:#372C19;
      --ink:#F2E9D8;
      --ink-soft:#C2B49A;
      --ink-faint:#8A7C63;
      --accent:#DDA653;
      --accent-strong:#F0C374;
      --accent-ink:#241A08;
      --tan:#8A6B3E;
      --good:#7FB584;
      --good-bg:#233022;
      --bad:#E2806C;
      --bad-bg:#3A2119;
      --line: rgba(242,233,216,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161209;
    --bg-elev:#1F1A10;
    --card-border:#372C19;
    --ink:#F2E9D8;
    --ink-soft:#C2B49A;
    --ink-faint:#8A7C63;
    --accent:#DDA653;
    --accent-strong:#F0C374;
    --accent-ink:#241A08;
    --tan:#8A6B3E;
    --good:#7FB584;
    --good-bg:#233022;
    --bad:#E2806C;
    --bad-bg:#3A2119;
    --line: rgba(242,233,216,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 30px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:1.25rem 1.25rem 3rem;
  }
  header.top{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:.5rem 1rem;
    margin-bottom:1rem;
    border-bottom:2px solid var(--card-border);
    padding-bottom:.65rem;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:.15rem;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .brand h1{
    font-family:'Big Shoulders Display', ui-sans-serif, sans-serif;
    font-weight:800;
    font-size:1.9rem;
    line-height:1;
    margin:0;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  .stagecount{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    text-align:right;
    color:var(--ink-soft);
    font-size:.85rem;
    white-space:nowrap;
  }
  .stagecount b{
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    font-size:1.1rem;
  }

  .progress{
    display:flex;
    gap:4px;
    margin-bottom:1.25rem;
  }
  .progress i{
    flex:1;
    height:6px;
    border-radius:3px;
    background:var(--card-border);
    display:block;
  }
  .progress i.done{ background:var(--accent); }
  .progress i.cur{ background:var(--ink-faint); }

  .card{
    background:var(--bg-elev);
    border:1px solid var(--card-border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:1.75rem;
  }

  .cite{
    display:inline-block;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.72rem;
    letter-spacing:.03em;
    color:var(--accent-strong);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding:.2rem .55rem;
    border-radius:999px;
    margin-bottom:.9rem;
  }

  .question{
    font-size:1.22rem;
    line-height:1.4;
    font-weight:600;
    margin:0 0 1.35rem;
    text-wrap:balance;
    max-width:60ch;
  }

  .pools{
    display:flex;
    flex-direction:column;
    gap:.6rem;
    margin-bottom:1.4rem;
  }
  .pool-option{
    display:flex;
    align-items:flex-start;
    gap:.75rem;
    padding:.9rem 1rem;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .pool-option:hover{ border-color:var(--accent); }
  .pool-option input{
    margin-top:.25rem;
    accent-color:var(--accent);
    flex:none;
  }
  .pool-option.selected{
    border-color:var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, var(--bg));
  }
  .pool-name{
    display:block;
    font-weight:600;
    font-size:1rem;
  }
  .pool-meta{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:.74rem;
    color:var(--ink-soft);
    margin-top:.2rem;
  }
  .pool-error{
    font-size:.85rem;
    color:var(--bad);
    background:var(--bad-bg);
    border:1px solid color-mix(in srgb, var(--bad) 35%, transparent);
    border-radius:8px;
    padding:.7rem .85rem;
    margin:0 0 1rem;
    line-height:1.5;
  }

  .pool-detail{
    display:flex;
    flex-direction:column;
    gap:.6rem;
    padding:.9rem 1rem;
    margin:-.2rem 0 1.4rem;
    border:1px solid var(--card-border);
    border-radius:10px;
    background: color-mix(in srgb, var(--tan) 14%, var(--bg));
    font-size:.85rem;
  }
  .pool-detail .row{
    display:flex;
    flex-wrap:wrap;
    gap:.4rem 1.2rem;
    color:var(--ink-soft);
  }
  .pool-detail .row b{ color:var(--ink); font-weight:600; }
  .pool-detail .badges{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    padding:.25rem .6rem;
    border-radius:999px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    color:var(--accent-strong);
  }
  .coverage-track{
    flex:none;
    width:60px;
    height:6px;
    border-radius:3px;
    background: var(--card-border);
    overflow:hidden;
  }
  .coverage-fill{
    height:100%;
    background:var(--accent);
    border-radius:3px;
  }
  .pool-detail .coverage-note{
    font-size:.76rem;
    color:var(--ink-faint);
    line-height:1.5;
  }

  .chapters-toolbar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:.5rem;
    margin-bottom:.6rem;
  }
  .chip-btn{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.72rem;
    padding:.3rem .65rem;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--bg);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip-btn:hover{ border-color:var(--accent); color:var(--ink); }
  .chapters-count{
    margin-left:auto;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.72rem;
    color:var(--ink-faint);
  }
  .chapters{
    display:grid;
    grid-template-columns:1fr;
    gap:.4rem;
    max-height:220px;
    overflow-y:auto;
    padding:.15rem;
    margin-bottom:1.4rem;
    border:1px solid var(--card-border);
    border-radius:10px;
    background:var(--bg);
  }
  @media (min-width:520px){
    .chapters{ grid-template-columns:1fr 1fr; }
  }
  .chapter-option{
    display:flex;
    align-items:flex-start;
    gap:.55rem;
    padding:.5rem .65rem;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
  }
  .chapter-option:hover{ background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .chapter-option input{ accent-color:var(--accent); flex:none; margin-top:.2rem; }
  .chapter-option .chapter-text{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:.05rem;
    min-width:0;
  }
  .chapter-option .chapter-title{
    line-height:1.3;
  }
  .chapter-option .chapter-code{
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.02em;
    color:var(--ink-faint);
  }
  .chapter-option .chapter-n{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-faint);
    flex:none;
    margin-top:.15rem;
  }
  .chapters-loading{
    padding:.9rem;
    font-size:.85rem;
    color:var(--ink-faint);
  }

  .subheading{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.7rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 .5rem;
  }

  .counts{
    display:flex;
    flex-wrap:wrap;
    gap:.5rem;
    margin-bottom:1.4rem;
  }
  .count-chip{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.85rem;
    font-weight:500;
    padding:.5rem 1.1rem;
    border-radius:999px;
    border:1px solid var(--card-border);
    background:var(--bg);
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease;
  }
  .count-chip:hover{ border-color:var(--accent); }
  .count-chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .count-chip.selected{
    border-color:var(--accent);
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:700;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:.6rem;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:.7rem;
    text-align:left;
    width:100%;
    padding:.85rem .95rem;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    font-size:.98rem;
    line-height:1.35;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
  }
  .opt:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .opt:active:not(:disabled){ transform: scale(0.996); }
  .opt:disabled{ cursor:default; }
  .opt .tag{
    flex:none;
    width:1.6rem;
    height:1.6rem;
    border-radius:6px;
    background:var(--card-border);
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:.75rem;
    font-weight:600;
  }
  .opt.correct{
    background:var(--good-bg);
    border-color:var(--good);
  }
  .opt.correct .tag{ background:var(--good); color:var(--accent-ink); }
  .opt.wrong{
    background:var(--bad-bg);
    border-color:var(--bad);
  }
  .opt.wrong .tag{ background:var(--bad); color:var(--accent-ink); }
  .opt.dim{ opacity:.55; }

  .feedback{
    margin-top:1.1rem;
    padding:.9rem 1rem;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg);
    font-size:.92rem;
    color:var(--ink-soft);
    line-height:1.5;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback b{ color:var(--ink); }
  .feedback .verdict{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.02em;
    display:block;
    margin-bottom:.25rem;
  }
  .feedback.ok .verdict{ color:var(--good); }
  .feedback.no .verdict{ color:var(--bad); }

  .refquote{
    margin:.7rem 0 0;
    padding:.7rem .85rem;
    border-left:3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    border-radius:0 8px 8px 0;
    font-size:.88rem;
    line-height:1.55;
    color:var(--ink);
  }
  .refquote .reflabel{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-strong);
    margin-bottom:.3rem;
  }

  .actions{
    display:flex;
    justify-content:flex-end;
    margin-top:1.4rem;
  }
  button.next{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:1.05rem;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:.7rem 1.4rem;
    border-radius:9px;
    cursor:pointer;
    display:none;
  }
  button.next.show{ display:inline-block; }
  button.next:hover{ background:var(--accent-strong); }
  button.next:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  /* results */
  .results h2{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:2.2rem;
    margin:0 0 .2rem;
    letter-spacing:.01em;
  }
  .results .sub{
    color:var(--ink-soft);
    margin:0 0 1.5rem;
    font-size:.95rem;
  }
  .scoreband{
    display:flex;
    align-items:baseline;
    gap:1rem;
    padding:1.2rem 1.4rem;
    border-radius:12px;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 20%, var(--bg-elev)), var(--bg-elev));
    border:1px solid var(--card-border);
    margin-bottom:1.5rem;
  }
  .scoreband .num{
    font-family:'JetBrains Mono', monospace;
    font-size:2.6rem;
    font-weight:600;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .scoreband .meta{ display:flex; flex-direction:column; gap:.2rem; }
  .scoreband .rank{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    color:var(--accent-strong);
  }
  .scoreband .note{ font-size:.78rem; color:var(--ink-faint); }

  table.metryczka{
    width:100%;
    border-collapse:collapse;
    font-size:.85rem;
  }
  table.metryczka th{
    text-align:left;
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
    border-bottom:1px solid var(--card-border);
    padding:.4rem .5rem;
  }
  table.metryczka td{
    border-bottom:1px solid var(--line);
    padding:.55rem .5rem;
    vertical-align:top;
  }
  table.metryczka td.q{ max-width:280px; }
  table.metryczka td.ref-cell{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  table.metryczka td.verdict-cell{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    white-space:nowrap;
  }
  .v-ok{ color:var(--good); }
  .v-no{ color:var(--bad); }
  .table-wrap{ overflow-x:auto; margin-top: 1rem; }

  .results-actions{
    display:flex;
    flex-wrap:wrap;
    gap:.75rem;
  }

  .restart{
    margin-top:1.75rem;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:700;
    letter-spacing:.03em;
    font-size:1rem;
    background:transparent;
    color:var(--accent-strong);
    border:1.5px solid var(--accent);
    padding:.65rem 1.3rem;
    border-radius:9px;
    cursor:pointer;
  }
  .restart:hover{ background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .restart.restart-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .restart.restart-primary:hover{ background:var(--accent-strong); }

  footer.credit{
    margin-top:2.5rem;
    text-align:center;
    color:var(--ink-faint);
    font-size:.75rem;
    font-family:'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce){
    .opt{ transition:none; }
  }

  @media (max-width:480px){
    .wrap{ padding:.85rem .75rem 2.5rem; }
    header.top{ margin-bottom:.85rem; padding-bottom:.55rem; }
    .brand h1{ font-size:1.5rem; }
    .brand .eyebrow{ font-size:.62rem; }
    .stagecount{ font-size:.76rem; }
    .stagecount b{ font-size:1rem; }
    .progress{ margin-bottom:1rem; }
    .card{ padding:1.1rem; }
    .question{ font-size:1.08rem; margin-bottom:1.1rem; }
    .opt{ padding:.7rem .8rem; font-size:.92rem; }
    .actions{ margin-top:1.1rem; }
    button.next{ width:100%; text-align:center; }
    .scoreband{ flex-wrap:wrap; }
    .scoreband .num{ font-size:2.1rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Baza pytań treningowych IPSC</span>
      <h1>Quiz Przepisów</h1>
    </div>
    <div class="stagecount" id="stagecount" hidden></div>
  </header>

  <div class="progress" id="progress" hidden></div>

  <section class="card" id="poolSelect">
    <span class="cite">Konfiguracja</span>
    <p class="question">Skonfiguruj quiz</p>

    <p class="subheading">Pula pytań</p>
    <div class="pools" id="poolsList"></div>

    <div class="pool-detail" id="poolDetail" hidden></div>

    <p class="subheading">Rozdziały i załączniki</p>
    <div class="chapters-toolbar">
      <button type="button" class="chip-btn" id="chaptersAllBtn">Zaznacz wszystkie</button>
      <button type="button" class="chip-btn" id="chaptersNoneBtn">Odznacz wszystkie</button>
      <span class="chapters-count" id="chaptersCount"></span>
    </div>
    <div class="chapters" id="chaptersList"></div>

    <p class="subheading">Liczba pytań</p>
    <div class="counts" id="countsList"></div>

    <p class="pool-error" id="poolError" hidden></p>
    <div class="actions"><button class="next show" id="startBtn">Rozpocznij →</button></div>
  </section>

  <main id="main"></main>

  <footer class="credit" id="siteFooter">Bank pytań treningowych IPSC — wybierz pulę powyżej, aby rozpocząć.</footer>
</div>

<script>
const POOLS = [
  {
    id: 'ipsc-handgun-2026',
    name: 'Pistolet Dynamiczny IPSC — styczeń 2026',
    file: 'pistol-012026.json'
  },
  {
    id: 'ipsc-shotgun-2026',
    name: 'Strzelba Dynamiczna IPSC — styczeń 2026',
    file: 'shotgun-012026.json'
  },
  {
    id: 'ipsc-rifle-2026',
    name: 'Karabin Dynamiczny IPSC — styczeń 2026',
    file: 'rifle-012026.json'
  }
];

const COUNT_OPTIONS = [
  { id:'all', label:'Wszystkie' },
  { id:'5', label:'5' },
  { id:'10', label:'10' },
  { id:'20', label:'20' }
];

let QUESTIONS = [];
let state = { i:0, answered:[] };
let currentPool = null;
let selectedPoolId = POOLS[0].id;
let selectedCount = 'all';
let selectedChapters = new Set();
let isRetryRound = false;

// poolId -> { status: 'loading'|'ready'|'error', data, error, chapters:[{name,count}] }
const poolCache = {};

const main = document.getElementById('main');
const progressEl = document.getElementById('progress');
const stagecountEl = document.getElementById('stagecount');
const poolSelectEl = document.getElementById('poolSelect');
const footerEl = document.getElementById('siteFooter');
const poolsListEl = document.getElementById('poolsList');
const poolDetailEl = document.getElementById('poolDetail');
const chaptersListEl = document.getElementById('chaptersList');
const chaptersCountEl = document.getElementById('chaptersCount');
const chaptersAllBtn = document.getElementById('chaptersAllBtn');
const chaptersNoneBtn = document.getElementById('chaptersNoneBtn');
const countsListEl = document.getElementById('countsList');
const poolErrorEl = document.getElementById('poolError');
const startBtn = document.getElementById('startBtn');

function renderPools(){
  poolsListEl.innerHTML = POOLS.map(p => `
    <label class="pool-option ${p.id===selectedPoolId ? 'selected' : ''}">
      <input type="radio" name="pool" value="${p.id}" ${p.id===selectedPoolId ? 'checked' : ''}>
      <span>
        <span class="pool-name">${p.name}</span>
        <span class="pool-meta">${p.file}</span>
      </span>
    </label>
  `).join('');
}
renderPools();

poolsListEl.addEventListener('change', (e)=>{
  if(e.target.name==='pool'){
    selectedPoolId = e.target.value;
    renderPools();
    ensurePoolLoaded(selectedPoolId);
  }
});

// Natural sort key so "Rozdział 2"/"Chapter 2" sorts before "Rozdział 10"/
// "Chapter 10", glossary follows its chapter, and "Załącznik"/"Appendix"
// entries sort by letter then number. Supports both the Polish and English
// chapter-naming schemes used across question pools.
function chapterSortKey(chapter){
  let m = chapter.match(/^(?:Rozdział|Chapter) (\d+)(?:\s*\((?:Glosariusz|Glossary)\))?/);
  if(m) return [0, parseInt(m[1],10), /\((?:Glosariusz|Glossary)\)/.test(chapter) ? 1 : 0];
  m = chapter.match(/^(?:Załącznik|Appendix) ([A-Z])\s*(\d+)?/);
  if(m) return [1, m[1].charCodeAt(0), m[2] ? parseInt(m[2],10) : 0, chapter];
  return [2, 0, 0, chapter];
}

function chaptersFromQuestions(questions, chapterNames){
  const counts = new Map();
  questions.forEach(q => counts.set(q.chapter, (counts.get(q.chapter)||0) + 1));
  return [...counts.entries()]
    .map(([name, count]) => ({name, count, title: (chapterNames && chapterNames[name]) || ''}))
    .sort((a,b) => {
      const ka = chapterSortKey(a.name), kb = chapterSortKey(b.name);
      for(let i=0; i<Math.max(ka.length,kb.length); i++){
        const va = ka[i] ?? 0, vb = kb[i] ?? 0;
        if(va !== vb) return va < vb ? -1 : 1;
      }
      return 0;
    });
}

async function ensurePoolLoaded(poolId){
  const pool = POOLS.find(p => p.id===poolId);
  if(poolCache[poolId] && poolCache[poolId].status !== 'error'){
    renderPoolDetail();
    return;
  }
  poolCache[poolId] = { status:'loading' };
  renderPoolDetail();
  try{
    const res = await fetch(pool.file, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if(!Array.isArray(data.questions) || data.questions.length===0) throw new Error('brak pytań w pliku');
    const chapters = chaptersFromQuestions(data.questions, (data.meta || {}).chapterNames);
    poolCache[poolId] = { status:'ready', data, chapters };
    if(poolId === selectedPoolId){
      selectedChapters = new Set(chapters.map(c => c.name)); // all selected by default
    }
  } catch(err){
    poolCache[poolId] = { status:'error', error: err.message };
  }
  renderPoolDetail();
}
ensurePoolLoaded(selectedPoolId);

function renderPoolDetail(){
  const entry = poolCache[selectedPoolId];
  poolErrorEl.hidden = true;

  if(!entry || entry.status==='loading'){
    poolDetailEl.hidden = false;
    poolDetailEl.innerHTML = `<span class="chapters-loading" style="padding:0;">Wczytywanie informacji o puli…</span>`;
    chaptersListEl.innerHTML = `<div class="chapters-loading">Wczytywanie rozdziałów…</div>`;
    chaptersCountEl.textContent = '';
    updateStartAvailability();
    return;
  }

  if(entry.status==='error'){
    poolDetailEl.hidden = true;
    chaptersListEl.innerHTML = '';
    chaptersCountEl.textContent = '';
    poolErrorEl.hidden = false;
    poolErrorEl.textContent = `Nie udało się wczytać puli pytań: ${entry.error}. Jeśli otwierasz ten plik bezpośrednio z dysku, uruchom lokalny serwer (np. „python3 -m http.server”) i otwórz stronę przez http://localhost — przeglądarki blokują odczyt plików JSON otwartych z file://.`;
    updateStartAvailability();
    return;
  }

  const meta = entry.data.meta || {};
  const cov = meta.coverage || null;
  poolDetailEl.hidden = false;
  poolDetailEl.innerHTML = `
    <div class="row"><b>${meta.rulesTitle || meta.title || ''}</b></div>
    <div class="row">
      <span>Plik źródłowy: <b>${meta.rulesFile || '—'}</b></span>
      <span>${meta.publicationNote || ''}</span>
    </div>
    <div class="badges">
      <span class="badge">📄 ${meta.count ?? entry.data.questions.length} pytań</span>
      ${cov ? `<span class="badge">
        <span class="coverage-track"><span class="coverage-fill" style="width:${cov.percent}%"></span></span>
        Pokrycie ~${cov.percent}%
      </span>` : ''}
    </div>
    ${cov ? `<div class="coverage-note">${cov.coveredProvisions} / ${cov.totalProvisions} ponumerowanych pozycji przepisów — ${cov.note}</div>` : ''}
  `;

  renderChapters();
  updateStartAvailability();
}

function renderChapters(){
  const entry = poolCache[selectedPoolId];
  if(!entry || entry.status!=='ready') return;
  chaptersListEl.innerHTML = entry.chapters.map(c => `
    <label class="chapter-option">
      <input type="checkbox" value="${c.name}" ${selectedChapters.has(c.name) ? 'checked' : ''}>
      <span class="chapter-text">
        <span class="chapter-title">${c.title || c.name}</span>
        ${c.title ? `<span class="chapter-code">${c.name}</span>` : ''}
      </span>
      <span class="chapter-n">${c.count}</span>
    </label>
  `).join('');
  const total = entry.chapters.reduce((s,c)=>s+c.count, 0);
  const selectedCountNum = entry.chapters.filter(c => selectedChapters.has(c.name)).reduce((s,c)=>s+c.count, 0);
  chaptersCountEl.textContent = `${selectedChapters.size}/${entry.chapters.length} rozdziałów · ${selectedCountNum}/${total} pytań`;
}

chaptersListEl.addEventListener('change', (e)=>{
  if(e.target.type!=='checkbox') return;
  if(e.target.checked) selectedChapters.add(e.target.value);
  else selectedChapters.delete(e.target.value);
  renderChapters();
  updateStartAvailability();
});

chaptersAllBtn.addEventListener('click', ()=>{
  const entry = poolCache[selectedPoolId];
  if(!entry || entry.status!=='ready') return;
  selectedChapters = new Set(entry.chapters.map(c => c.name));
  renderChapters();
  updateStartAvailability();
});

chaptersNoneBtn.addEventListener('click', ()=>{
  selectedChapters = new Set();
  renderChapters();
  updateStartAvailability();
});

function updateStartAvailability(){
  const entry = poolCache[selectedPoolId];
  const ready = entry && entry.status==='ready' && selectedChapters.size>0;
  startBtn.disabled = !ready;
  startBtn.title = (entry && entry.status==='ready' && selectedChapters.size===0)
    ? 'Wybierz co najmniej jeden rozdział lub załącznik'
    : '';
}

function renderCounts(){
  countsListEl.innerHTML = COUNT_OPTIONS.map(c => `
    <button type="button" class="count-chip ${c.id===selectedCount ? 'selected' : ''}" data-count="${c.id}">${c.label}</button>
  `).join('');
}
renderCounts();

countsListEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.count-chip');
  if(!btn) return;
  selectedCount = btn.dataset.count;
  renderCounts();
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuestionSet(allQuestions, countId){
  if(countId==='all') return allQuestions.slice();
  const n = Math.min(parseInt(countId, 10), allQuestions.length);
  return shuffle(allQuestions).slice(0, n);
}

function freshState(questions){
  return {
    i: 0,
    answered: new Array(questions.length).fill(null),
    order: questions.map(() => shuffle([0,1,2,3]))
  };
}

startBtn.addEventListener('click', startQuiz);

function startQuiz(){
  const pool = POOLS.find(p => p.id===selectedPoolId);
  const entry = poolCache[selectedPoolId];
  if(!entry || entry.status!=='ready' || selectedChapters.size===0) return;

  const filtered = entry.data.questions.filter(q => selectedChapters.has(q.chapter));
  QUESTIONS = buildQuestionSet(filtered, selectedCount);
  currentPool = pool;
  isRetryRound = false;
  state = freshState(QUESTIONS);

  poolSelectEl.hidden = true;
  footerEl.hidden = true;
  stagecountEl.hidden = false;
  progressEl.hidden = false;
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}

function backToPoolSelect(){
  poolSelectEl.hidden = false;
  footerEl.hidden = false;
  stagecountEl.hidden = true;
  progressEl.hidden = true;
  main.innerHTML = '';
  window.scrollTo({top:0, behavior:'smooth'});
}

function retryWrongOnly(){
  const wrong = QUESTIONS.filter((item, idx) => state.answered[idx] !== item.c);
  if(wrong.length===0) return;
  QUESTIONS = wrong;
  isRetryRound = true;
  state = freshState(QUESTIONS);
  progressEl.hidden = false;
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildProgress(){
  progressEl.innerHTML = '';
  QUESTIONS.forEach((_,idx)=>{
    const i = document.createElement('i');
    if(state.answered[idx]!==null) i.className='done';
    else if(idx===state.i) i.className='cur';
    progressEl.appendChild(i);
  });
}

function renderQuestion(){
  const idx = state.i;
  const item = QUESTIONS[idx];
  const order = state.order[idx]; // original option indices, in the order shown this round
  stagecountEl.innerHTML = `PYTANIE <b>${idx+1}</b> / ${QUESTIONS.length}`;
  buildProgress();

  const already = state.answered[idx];
  const letters = ['A','B','C','D'];

  main.innerHTML = `
    <div class="card">
      <span class="cite">${item.ref}</span>
      <p class="question">${item.q}</p>
      <div class="options" id="opts"></div>
      <div class="actions"><button class="next" id="nextBtn">${idx===QUESTIONS.length-1 ? 'Zobacz wynik →' : 'Następne pytanie →'}</button></div>
      <div class="feedback" id="fb"></div>
    </div>
  `;

  const optsEl = document.getElementById('opts');
  order.forEach((originalIndex, pos)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="tag">${letters[pos]}</span><span>${item.o[originalIndex]}</span>`;
    b.disabled = already!==null;
    if(already!==null){
      if(originalIndex===item.c) b.classList.add('correct');
      else if(originalIndex===already) b.classList.add('wrong');
      else b.classList.add('dim');
    }
    b.addEventListener('click', ()=>selectAnswer(originalIndex));
    optsEl.appendChild(b);
  });

  if(already!==null) showFeedback(idx, already);
}

function selectAnswer(oi){
  const idx = state.i;
  if(state.answered[idx]!==null) return;
  state.answered[idx] = oi;
  renderQuestion();
  document.getElementById('nextBtn').classList.add('show');
}

function showFeedback(idx, chosen){
  const item = QUESTIONS[idx];
  const fb = document.getElementById('fb');
  const ok = chosen===item.c;
  fb.classList.add('show', ok?'ok':'no');
  fb.innerHTML = `<span class="verdict">${ok ? 'Trafienie w A.' : 'Chybienie.'}</span>
    <div class="refquote">
      <span class="reflabel">Treść przepisu — ${item.ref}</span>
      „${item.refText}”
    </div>`;
  document.getElementById('nextBtn').classList.add('show');
}

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='nextBtn'){
    if(state.i < QUESTIONS.length-1){
      state.i++;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      renderResults();
    }
  }
  if(e.target && e.target.id==='restartBtn'){
    state = freshState(QUESTIONS);
    progressEl.hidden = false;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(e.target && e.target.id==='changePoolBtn'){
    backToPoolSelect();
  }
  if(e.target && e.target.id==='retryWrongBtn'){
    retryWrongOnly();
  }
});

function renderResults(){
  const correctCount = state.answered.reduce((s,a,idx)=> s + (a===QUESTIONS[idx].c ? 1:0), 0);
  const total = QUESTIONS.length;
  const wrongCount = total - correctCount;
  const pct = Math.round((correctCount/total)*100);
  let rank, rankNote;
  if(pct>=90){ rank='Grandmaster'; }
  else if(pct>=75){ rank='Master'; }
  else if(pct>=60){ rank='Klasa A'; }
  else if(pct>=40){ rank='Klasa B'; }
  else { rank='Klasa D — czas na powtórkę przepisów'; }
  rankNote = '(nieoficjalna skala żartobliwie nawiązująca do klasyfikacji IPSC, nie ma związku z ICS)';

  stagecountEl.innerHTML = '';
  progressEl.hidden = true;

  const rows = QUESTIONS.map((item, idx)=>{
    const chosen = state.answered[idx];
    const ok = chosen===item.c;
    return `<tr>
      <td class="q">${item.q}</td>
      <td>${item.o[item.c]}</td>
      <td class="ref-cell">${item.ref}</td>
      <td class="verdict-cell ${ok?'v-ok':'v-no'}">${ok? 'TRAFIENIE':'CHYBIENIE'}</td>
    </tr>`;
  }).join('');

  const subText = isRetryRound
    ? `Powtórka błędnych pytań z puli „${currentPool.name}” — ${total} pytań.`
    : `Ukończono pulę „${currentPool.name}” — ${total} pytań.`;

  const retryWrongButton = wrongCount>0
    ? `<button class="restart restart-primary" id="retryWrongBtn">Powtórz błędne pytania (${wrongCount})</button>`
    : '';

  main.innerHTML = `
    <div class="card results">
      <h2>Metryczka wyników</h2>
      <p class="sub">${subText}</p>
      <div class="scoreband">
        <span class="num">${correctCount}/${total}</span>
        <div class="meta">
          <span class="rank">${rank}</span>
          <span class="note">Wynik: ${pct}% &middot; ${rankNote}</span>
        </div>
      </div>
      <div class="table-wrap">
        <table class="metryczka">
          <thead><tr><th>Pytanie</th><th>Poprawna odpowiedź</th><th>Przepis</th><th>Wynik</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="results-actions">
        ${retryWrongButton}
        <button class="restart" id="restartBtn">Strzelaj ponownie</button>
        <button class="restart" id="changePoolBtn">Zmień pulę pytań</button>
      </div>
    </div>
  `;
}
</script>
</body>
</html>
